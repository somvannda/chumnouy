name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chumnouy_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: OpenAPI drift check
        run: |
          python scripts/export_openapi.py
          if git ls-files --error-unmatch openapi.json >/dev/null 2>&1; then
            git diff --exit-code -- openapi.json
          else
            echo "openapi.json not committed yet — skipping drift check"
          fi
      - name: Lint
        run: ruff check app
      - name: Tests
        run: pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  client:
    name: API client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate and check for drift
        run: |
          node packages/api-client/scripts/generate.mjs
          git diff --exit-code -- packages/api-client/src/schema.ts
