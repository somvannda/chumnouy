# Single-host deployment: Postgres + API + console (nginx).
#   docker compose -f deploy/docker-compose.yml up --build
# Then open http://localhost:8080. Set JWT_SECRET (and any provider keys) via a
# .env file next to this compose file or the shell environment.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chumnouy
      POSTGRES_PASSWORD: chumnouy
      POSTGRES_DB: chumnouy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chumnouy -d chumnouy"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://chumnouy:chumnouy@db:5432/chumnouy
      SYNC_DATABASE_URL: postgresql+psycopg://chumnouy:chumnouy@db:5432/chumnouy
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
      API_PUBLIC_URL: http://localhost:8080
      MEDIA_ROOT: /data/media
      # Enable the in-process worker (webhook + Notifyr delivery). Run only one.
      WEBHOOK_WORKER_ENABLED: "true"
      PUBLIC_RATE_LIMIT_PER_MINUTE: "120"
      # Optional AI / Notifyr defaults; per-workspace settings override these.
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      NOTIFYR_API_URL: ${NOTIFYR_API_URL:-}
      NOTIFYR_API_KEY: ${NOTIFYR_API_KEY:-}
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  media:
